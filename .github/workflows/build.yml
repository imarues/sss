name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, batsign-backend-port, batsign-root-fix, download-engine-root-fix]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize BatSign Zsign snapshot
        run: |
          set -euo pipefail
          mkdir -p Vendor
          cat Vendor/ZsignSnapshot/Zsign.part*.b64 | base64 --decode > /tmp/Zsign-snapshot.zip
          ACTUAL="$(shasum -a 256 /tmp/Zsign-snapshot.zip | awk '{print $1}')"
          EXPECTED="626e60acb0fa985c4d496bed3659403779465bb775cac2d8a8681114ed3d4296"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf Vendor/Zsign
          unzip -q /tmp/Zsign-snapshot.zip -d Vendor
          test -f Vendor/Zsign/Package.swift
          test -f Vendor/Zsign/Sources/zsign.swift
          test -f Vendor/Zsign/src/zsign.cpp
          echo "BatSign Zsign snapshot verified: $ACTUAL"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project TurathReplica.xcodeproj \
            -scheme TurathReplica \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/TurathReplica.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TurathReplica-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurathReplica-unsigned
          path: TurathReplica-unsigned.ipa
          if-no-files-found: error
