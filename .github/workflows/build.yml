name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, batsign-root-fix]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project TurathReplica.xcodeproj \
            -scheme TurathReplica \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/TurathReplica.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TurathReplica-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurathReplica-unsigned
          path: TurathReplica-unsigned.ipa
          if-no-files-found: error