name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, batsign-backend-port, batsign-root-fix, download-engine-root-fix, feature/turath-signing-hub]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify vendored BatSign Zsign
        run: |
          set -euo pipefail
          test -f Vendor/Zsign/Package.swift
          test -f Vendor/Zsign/Sources/zsign.swift
          test -f Vendor/Zsign/src/zsign.cpp
          test -f Vendor/Zsign/src/zsign.mm
          echo "Using local BatSign Zsign source from Vendor/Zsign"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "XcodeGen install attempt $attempt"
            if brew install xcodegen; then
              xcodegen --version
              exit 0
            fi
            sleep $((attempt * 5))
            brew update --force --quiet || true
          done

          echo "Unable to install XcodeGen after retries"
          exit 1

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project TurathReplica.xcodeproj \
            -scheme TurathReplica \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            echo "===== XCODE ERRORS ====="
            grep -n -E "error:|fatal error:" build.log | tail -120 || true
            echo "===== BUILD TAIL ====="
            tail -120 build.log
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/TurathReplica.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TurathReplica-unsigned.ipa Payload
          unzip -tq TurathReplica-unsigned.ipa
          unzip -Z1 TurathReplica-unsigned.ipa | grep -q '^Payload/TurathReplica.app/Info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurathReplica-unsigned
          path: TurathReplica-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

          unzip -Z1 TurathReplica-unsigned.ipa | grep -q '^Payload/TurathReplica.app/TurathReplica

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurathReplica-unsigned
          path: TurathReplica-unsigned.ipa
          if-no-files-found: error


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TurathReplica-unsigned
          path: TurathReplica-unsigned.ipa
          if-no-files-found: error
