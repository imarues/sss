name: Materialize BatSign Zsign Once

on:
  push:
    branches: [batsign-backend-port]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip when Zsign is already vendored
        id: check
        run: |
          if [ -f Vendor/Zsign/Package.swift ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exported BatSign Zsign snapshot
        if: steps.check.outputs.done != 'true'
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-df04-81f4-bbfd-20fd8bed4309/raw?se=2026-10-21T22%3A42%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=63615ef7-668f-57ac-8ca6-181d9642bb0e&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-21T08%3A11%3A58Z&ske=2026-10-22T08%3A11%3A58Z&sks=b&skv=2026-02-06&sig=m1y1TMkwvNQ61g4rlcYc%2BXa9E1IE3mB%2BRpIMDCbs/do%3D' -o /tmp/export-artifact.zip
          rm -rf /tmp/zexport
          mkdir -p /tmp/zexport
          unzip -q /tmp/export-artifact.zip -d /tmp/zexport
          test -f /tmp/zexport/Zsign-snapshot.zip
          ACTUAL="$(sha256sum /tmp/zexport/Zsign-snapshot.zip | awk '{print $1}')"
          test "$ACTUAL" = "626e60acb0fa985c4d496bed3659403779465bb775cac2d8a8681114ed3d4296"
          rm -rf Vendor/Zsign Vendor/ZsignSnapshot
          mkdir -p Vendor
          unzip -q /tmp/zexport/Zsign-snapshot.zip -d Vendor
          test -f Vendor/Zsign/Package.swift
          test -f Vendor/Zsign/Sources/zsign.swift
          test -f Vendor/Zsign/src/zsign.cpp
          git rm -f Vendor/BatSign .gitmodules 2>/dev/null || true
      - name: Commit vendored Zsign source
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Vendor BatSign Zsign source locally'
          git push origin HEAD:batsign-backend-port
