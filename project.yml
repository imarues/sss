name: TurathReplica
options:
  bundleIdPrefix: com.ikiraplus
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  TurathReplica:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StoreReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikiraplus.turathreplica
        PRODUCT_NAME: TurathReplica
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "التراث بلس"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
