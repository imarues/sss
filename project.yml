name: TurathReplica

options:
  bundleIdPrefix: com.ikiraplus
  xcodeVersion: "16.0"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.1"

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""

packages:
  BatSignZsign:
    path: Vendor/Zsign
  Zip:
    url: https://github.com/marmelroy/Zip.git
    exactVersion: 2.1.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.16

targets:
  TurathLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: TurathLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikiraplus.turathreplica.liveactivity
        PRODUCT_NAME: TurathLiveActivity
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TurathLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: "Turath Live"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TurathReplica:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: StoreReplica
      - path: Shared
    dependencies:
      - package: BatSignZsign
        product: ZsignSwift
      - package: Zip
        product: Zip
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: TurathLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikiraplus.turathreplica
        PRODUCT_NAME: TurathReplica
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: StoreReplica/Info.plist
      properties:
        CFBundleDisplayName: "التراث بلس"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations:
          - ar
          - en
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets: []
